parameters:
- name: buildConfiguration
  type: string
  default: Release
- name: assemblyVersion
  type: string
- name: fileVersion
  type: string
- name: informationalVersion
  type: string

steps:
- pwsh: |
    $PSNativeCommandUseErrorActionPreference = $true
    df -h
    docker system df
    docker image prune --all --force
    docker builder prune --all --force
    df -h
    docker system df
  displayName: Pre-Build Docker Cleanup
  continueOnError: true

- pwsh: |
    # Use dotnet cli directly to resolve the MSTest.Sdk project
    $PSNativeCommandUseErrorActionPreference = $true
    dotnet restore Microsoft.Health.slnx `
        "-p:ContinuousIntegrationBuild=true;AssemblyVersion=$env:ASSEMBLY_VERSION;FileVersion=$env:FILE_VERSION;InformationalVersion=$env:INFORMATIONAL_VERSION" `
        -warnaserror
  displayName: Restore NuGet Packages
  workingDirectory: $(Build.SourcesDirectory)
  env:
    ASSEMBLY_VERSION: ${{ parameters.assemblyVersion }}
    FILE_VERSION: ${{ parameters.fileVersion }}
    INFORMATIONAL_VERSION: ${{ parameters.informationalVersion }}

- task: DotNetCoreCLI@2
  displayName: Build Solution
  inputs:
    command: build
    projects: Microsoft.Health.slnx
    arguments: >-
      --configuration "${{ parameters.buildConfiguration }}"
      "-p:ContinuousIntegrationBuild=true;AssemblyVersion=${{ parameters.assemblyVersion }};FileVersion=${{ parameters.fileVersion }};InformationalVersion=${{ parameters.informationalVersion }}"
      --no-restore
      -warnaserror
    workingDirectory: $(Build.SourcesDirectory)

- bash: bash "$BUILD_SOURCESDIRECTORY/.pipelines/scripts/install-functions-core-tools.sh"
  displayName: Install Azure Functions Core Tools

- pwsh: |
    $PSNativeCommandUseErrorActionPreference = $true
    $name = "azure-storage-$env:BUILD_BUILDID-$env:SYSTEM_JOBATTEMPT"
    docker run --detach --rm --name $name `
        --publish 127.0.0.1:10000:10000 `
        --publish 127.0.0.1:10001:10001 `
        --publish 127.0.0.1:10002:10002 `
        mcr.microsoft.com/azure-storage/azurite:latest `
        azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck
    Write-Host '##vso[task.setvariable variable=AzuriteStarted]true'
  displayName: Start Azurite

- pwsh: |
    $PSNativeCommandUseErrorActionPreference = $true
    $env:MSSQL_SA_PASSWORD = "Test1!$([Guid]::NewGuid().ToString('N'))"
    Write-Host "##vso[task.setvariable variable=SqlPassword;issecret=true]$env:MSSQL_SA_PASSWORD"
    $name = "sql-server-$env:BUILD_BUILDID-$env:SYSTEM_JOBATTEMPT"
    docker run --detach --rm --name $name `
        --env ACCEPT_EULA=Y --env MSSQL_SA_PASSWORD `
        --publish 127.0.0.1:1433:1433 `
        mcr.microsoft.com/mssql/server:2022-latest
    Write-Host '##vso[task.setvariable variable=SqlServerStarted]true'
  displayName: Start SQL Server

- pwsh: |
    # SQL Server needs time to initialize; nonzero sqlcmd exits are retried here only.
    $PSNativeCommandUseErrorActionPreference = $false
    $name = "sql-server-$env:BUILD_BUILDID-$env:SYSTEM_JOBATTEMPT"
    for ($attempt = 0; $attempt -lt 24; $attempt++) {
        docker exec --env SQLCMDPASSWORD $name `
            /opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -C -Q 'SELECT 1'
        if ($LASTEXITCODE -eq 0) {
            exit 0
        }

        Start-Sleep -Seconds 5
    }

    docker logs $name
    throw 'SQL Server did not become ready within two minutes.'
  displayName: Wait for SQL Server
  env:
    SQLCMDPASSWORD: $(SqlPassword)

- bash: |
    set -euo pipefail
    exampleDirectory="$BUILD_SOURCESDIRECTORY/test/Microsoft.Health.Functions.Worker.Examples"
    # func start --no-build expects the compiled app in bin/output.
    mkdir -p "$exampleDirectory/bin/output"
    cp -R "$exampleDirectory/bin/$BUILD_CONFIGURATION/net10.0/." "$exampleDirectory/bin/output"

    # Redirect all streams so the host outlives this step without holding the agent's pipes.
    cd "$exampleDirectory"
    nohup func start --port 7071 --no-build --prefix bin/output \
        < /dev/null > "$AGENT_TEMPDIRECTORY/azure-functions.log" 2>&1 &
    echo "##vso[task.setvariable variable=AzureFunctionsPid]$!"
    echo '##vso[task.setvariable variable=AzureFunctionsStarted]true'
  displayName: Start Azure Functions
  env:
    BUILD_CONFIGURATION: ${{ parameters.buildConfiguration }}
    AzureWebJobsStorage: UseDevelopmentStorage=true
    AzureFunctionsJobHost__Extensions__DurableTask__StorageProvider__ConnectionName: AzureWebJobsStorage
    AzureFunctionsJobHost__Extensions__DurableTask__HubName: WorkerIntegrationTests
    DurableTask__ConnectionName: AzureWebJobsStorage

- pwsh: |
    # The host needs time to start; failed health checks are retried here only.
    for ($attempt = 0; $attempt -lt 24; $attempt++) {
        if (-not (Get-Process -Id $env:AZURE_FUNCTIONS_PID -ErrorAction SilentlyContinue)) {
            throw 'Azure Functions host exited before becoming ready. See the Stop Azure Functions step for its logs.'
        }

        try {
            Invoke-WebRequest -Uri 'http://localhost:7071/api/healthz' -TimeoutSec 5 | Out-Null
            exit 0
        }
        catch {
            Start-Sleep -Seconds 5
        }
    }

    throw 'Azure Functions host did not become ready within two minutes. See the Stop Azure Functions step for its logs.'
  displayName: Wait for Azure Functions
  env:
    AZURE_FUNCTIONS_PID: $(AzureFunctionsPid)

- task: DotNetCoreCLI@2
  displayName: Test Solution
  inputs:
    command: test
    # Runs dotnet test --project once per matching test project.
    projects: |
      src/**/*Tests*.csproj
      test/**/*Tests*.csproj
    arguments: >-
      --configuration "${{ parameters.buildConfiguration }}"
      --coverage
      --coverage-output-format cobertura
      --coverage-settings "$(Build.SourcesDirectory)/CodeCoverage.config"
      "-p:ContinuousIntegrationBuild=true;AssemblyVersion=${{ parameters.assemblyVersion }};FileVersion=${{ parameters.fileVersion }};InformationalVersion=${{ parameters.informationalVersion }}"
      --no-build
      --publish-azdo-test-results
      --report-azdo
      --results-directory "$(Agent.TempDirectory)/TestResults"
    # Results are published by --publish-azdo-test-results instead of the task's TRX upload.
    publishTestResults: false
    workingDirectory: $(Build.SourcesDirectory)
  env:
    SYSTEM_ACCESSTOKEN: $(System.AccessToken)
    FunctionWorkerTest__DurableTask__ConnectionString: UseDevelopmentStorage=true
    FunctionWorkerTest__DurableTask__TaskHubName: WorkerIntegrationTests
    FunctionWorkerTest__Port: '7071'
    TestSqlConnectionString: 'Server=(local);Persist Security Info=False;User ID=sa;Password=$(SqlPassword);MultipleActiveResultSets=False;Connection Timeout=30;TrustServerCertificate=true'

- task: PublishCodeCoverageResults@2
  displayName: Publish Code Coverage
  condition: succeededOrFailed()
  inputs:
    summaryFileLocation: $(Agent.TempDirectory)/TestResults/**/*.cobertura.xml

- pwsh: |
    $logPath = Join-Path $env:AGENT_TEMPDIRECTORY 'azure-functions.log'
    try {
        $funcHost = Get-Process -Id $env:AZURE_FUNCTIONS_PID -ErrorAction SilentlyContinue
        if ($funcHost) {
            # SIGINT lets the host shut down its worker gracefully before falling back to a forced kill.
            kill -s INT $funcHost.Id
            if (-not $funcHost.WaitForExit(30000)) {
                $funcHost.Kill($true)
            }
        }
        else {
            Write-Host '##vso[task.logissue type=warning]Azure Functions host exited before it was stopped.'
        }
    }
    finally {
        if (Test-Path $logPath) {
            Get-Content $logPath
        }
    }
  displayName: Stop Azure Functions
  condition: and(always(), eq(variables['AzureFunctionsStarted'], 'true'))
  env:
    AZURE_FUNCTIONS_PID: $(AzureFunctionsPid)

- pwsh: |
    $PSNativeCommandUseErrorActionPreference = $true
    docker stop "azure-storage-$env:BUILD_BUILDID-$env:SYSTEM_JOBATTEMPT"
  displayName: Stop Azurite
  condition: and(always(), eq(variables['AzuriteStarted'], 'true'))

- pwsh: |
    $PSNativeCommandUseErrorActionPreference = $true
    docker stop "sql-server-$env:BUILD_BUILDID-$env:SYSTEM_JOBATTEMPT"
  displayName: Stop SQL Server
  condition: and(always(), eq(variables['SqlServerStarted'], 'true'))

- pwsh: |
    $PSNativeCommandUseErrorActionPreference = $true
    df -h
    docker system df
    docker image prune --all --force
    docker builder prune --all --force
    df -h
    docker system df
  displayName: Post-Build Docker Cleanup
  condition: always()
  continueOnError: true
