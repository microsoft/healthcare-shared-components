steps:
- task: DotNetCoreCLI@2
  displayName: Install GitVersion
  inputs:
    command: custom
    custom: tool
    arguments: 'install GitVersion.Tool --version 6.* --tool-path "$(Agent.TempDirectory)/gitversion" --configfile nuget.config'
    workingDirectory: $(Build.SourcesDirectory)

- pwsh: |
    $PSNativeCommandUseErrorActionPreference = $true
    $version = & (Join-Path $env:AGENT_TEMPDIRECTORY 'gitversion/dotnet-gitversion') -config GitVersion.yml -output json -nofetch | Out-String | ConvertFrom-Json

    Write-Host "##vso[task.setvariable variable=assemblySemVer;isOutput=true]$($version.AssemblySemVer)"
    Write-Host "##vso[task.setvariable variable=assemblySemFileVer;isOutput=true]$($version.AssemblySemFileVer)"
    Write-Host "##vso[task.setvariable variable=informationalVersion;isOutput=true]$($version.InformationalVersion)"
    Write-Host "##vso[task.setvariable variable=nuGetVersion;isOutput=true]$($version.MajorMinorPatch)$($version.PreReleaseLabelWithDash)"
  name: version
  displayName: Determine version
  workingDirectory: $(Build.SourcesDirectory)
