name: CodeQL

on:
  push:
    branches: [ main ]
  schedule:
  - cron: '0 0 * * 0'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    permissions:
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install .NET SDK
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: 'global.json'
        dotnet-version: |
          8.x
          9.x
          10.x

    # Note that CodeQL does not officially support .NET 10 yet, so we have to use a nightly build
    - name: Initialize CodeQL
      uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        languages: 'csharp'

    - name: dotnet restore
      shell: bash
      run: dotnet restore Microsoft.Health.slnx

    - name: dotnet build
      shell: bash
      run: dotnet build Microsoft.Health.slnx -c Release -p:ContinuousIntegrationBuild=true

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
