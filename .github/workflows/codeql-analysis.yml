name: CodeQL

on:
  push:
    branches: [ main ]
  schedule:
  - cron: '0 0 * * 0'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    permissions:
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install .NET SDK
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: 'global.json'
        dotnet-version: |
          8.x
          9.x
          10.x

    # Note that CodeQL does not officially support .NET 10 yet, so we have to use a nightly build
    - name: Initialize CodeQL
      uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
      with:
        languages: 'csharp'

    - name: dotnet restore
      shell: bash
      run: dotnet restore Microsoft.Health.slnx

    - name: dotnet build
      shell: bash
      run: dotnet build Microsoft.Health.slnx -c Release -p:ContinuousIntegrationBuild=true

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
